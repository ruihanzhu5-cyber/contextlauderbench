name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
